<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contactanos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="contacto.css" />
</head>
<body>
   
  <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="Producto">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>
<br><br><br>
  <section class="tarjeta tarjeta-contacto">
    <h2 id="tituloFormularioContacto">Envíanos un mensaje</h2>

    <form id="formularioContacto">
      <!-- Campo oculto para almacenar el ID durante la edición -->
      <input type="hidden" id="mensajeId" />

      <div class="campo">
        <label for="nombreContacto">Nombre:</label>
        <input type="text" id="nombreContacto" placeholder="Tu nombre" required />
      </div>

      <div class="campo">
        <label for="correoContacto">Correo electrónico:</label>
        <input type="email" id="correoContacto" placeholder="tu@correo.com" required />
      </div>

      <div class="campo">
        <label for="asuntoContacto">Asunto:</label>
        <input type="text" id="asuntoContacto" placeholder="Asunto del mensaje" required />
      </div>

      <div class="campo">
        <label for="mensajeContacto">Mensaje:</label>
        <textarea id="mensajeContacto" placeholder="Escribe tu mensaje" required></textarea>
      </div>

      <div class="acciones">
        <button type="submit" id="btnGuardarContacto" class="btn btn-contacto">Enviar mensaje</button>
        <button type="button" id="btnCancelarContacto" class="btn" style="display: none; background-color: #64748b;">Cancelar edición</button>
      </div>
    </form>
  </section>

  <!-- Historial de comentarios/mensajes debajo del formulario -->
  <section class="tarjeta" style="margin-top: 24px;">
    <h2>Historial de mensajes</h2>
    <div id="listaMensajes"></div>
  </section>
    <footer class="footer">
    <div class="contenedor footer-contenido">
      <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </div>
  </footer>
<script src="app.js"></script>
</body>
</html>
